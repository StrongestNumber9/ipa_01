services:
  ipa-server:
    hostname: 'ipa-server.ipa.example.test'
    container_name: 'ipa-server'
    image: "server:latest"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      ipa.example.test:
        ipv4_address: 192.168.155.100
        ipv6_address: fd12:4567:789a:1::100
    privileged: true
    tty: true
    volumes:
      - type: tmpfs
        target: /run
      - type: tmpfs
        target: /var/run
      - ./files/pre/:/ipa_01.conf.d/pre/
      - ./files/post/:/ipa_01.conf.d/post/
      - ${RUNNER_TEMP:-/tmp/ipa_01_tmp/}:/return/
    env_file: common.env
    healthcheck:
      test: ["CMD-SHELL", "ipactl status"]
      interval: 10s
      retries: 54
      start_period: 60s
      timeout: 10s

  ipa-client-8:
    hostname: 'ipa-client-8.ipa.example.test'
    container_name: 'ipa-client-8'
    image: "client/8:latest"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      ipa.example.test:
        ipv4_address: 192.168.155.101
        ipv6_address: fd12:4567:789a:1::101
    privileged: true
    tty: true
    volumes:
      - type: tmpfs
        target: /run
      - type: tmpfs
        target: /var/run
      - ./files/pre/:/ipa_01.conf.d/pre/
      - ./files/post/:/ipa_01.conf.d/post/
      - ${RUNNER_TEMP:-/tmp/ipa_01_tmp/}:/return/
    env_file: common.env
    depends_on:
      ipa-server:
        condition: service_healthy

  ipa-client-9:
    hostname: 'ipa-client-9.ipa.example.test'
    container_name: 'ipa-client-9'
    image: "client/9:latest"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      ipa.example.test:
        ipv4_address: 192.168.155.102
        ipv6_address: fd12:4567:789a:1::102
    privileged: true
    tty: true
    volumes:
      - type: tmpfs
        target: /run
      - type: tmpfs
        target: /var/run
      - ./files/pre/:/ipa_01.conf.d/pre/
      - ./files/post/:/ipa_01.conf.d/post/
      - ${RUNNER_TEMP:-/tmp/ipa_01_tmp/}:/return/
    env_file: common.env
    depends_on:
      ipa-server:
        condition: service_healthy

  manager:
    hostname: 'manager.ipa.example.test'
    container_name: 'manager'
    image: "rockylinux/rockylinux:9"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      ipa.example.test:
        ipv4_address: 192.168.155.103
        ipv6_address: fd12:4567:789a:1::103
    privileged: true
    tty: true
    volumes:
      - ./files/manager/:/manager/
      - ${RUNNER_TEMP:-/tmp/ipa_01_tmp/}:/return/
    entrypoint: /usr/bin/bash /manager/entrypoint.sh

networks:
  ipa.example.test:
    name: ipa.example.test
    enable_ipv6: true
    ipam:
      driver: default
      config:
       - subnet: 192.168.155.0/24
         gateway: 192.168.155.1
       - subnet: fd12:4567:789a:1::/64
         gateway: fd12:4567:789a:1::1
