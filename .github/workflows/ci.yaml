name: CI

on: [ push ]

jobs:
  build_containers:
    name: Build containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [ "8", "9" ]
        type: [ "client", "server" ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build containers
        run: docker build . --tag "${{ matrix.type }}/${{ matrix.version }}:latest" -f "Dockerfile.${{ matrix.type }}" --build-arg ROCKY_VERSION="${{ matrix.version }}"

  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: build_containers
    strategy:
      matrix:
        version: ["8", "9" ]
    steps:
      - name: Run container tests
        timeout-minutes: 15
        run: cd "src/test/functionality" && docker compose up --no-color -e ROCKY_VERSION="${{ matrix.version }}" && grep 'success' "${{ runner.temp }}/cluster.status"
