name: CI

on: [ push ]

jobs:
  build_containers:
    name: Build containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [
          { "version": "8", "type": "client" },
          { "version": "9", "type": "client" },
          { "version": "9", "type": "server" }
        ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build containers
        run: docker build . --tag "${{ matrix.containers.type }}/${{ matrix.containers.version }}:latest" -f "Dockerfile.${{ matrix.containers.type }}" --build-arg ROCKY_VERSION="${{ matrix.containers.version }}"

  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: build_containers
    steps:
      - name: Run container tests
        timeout-minutes: 15
        run: cd "src/test/functionality" && docker compose up --no-color && grep 'success' "${{ runner.temp }}/cluster.status"
